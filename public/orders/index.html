<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>月暈 ERP｜訂單管理</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">月暈 ERP</span>
    <div>
      <a class="btn btn-outline-light btn-sm" href="../products/index.html">商品管理</a>
      <a class="btn btn-outline-light btn-sm" href="index.html">訂單管理</a>
      <button class="btn btn-danger btn-sm" onclick="logout()">登出</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">
        建立訂單（多商品）
      </div>
      <div class="card-body">
        <div id="items"></div>
        <input id="customerName" class="form-control mb-2" placeholder="客人名稱 / 訂貨人" />

        <button class="btn btn-outline-primary btn-sm" onclick="addItem()">➕ 新增商品</button>
        <button class="btn btn-primary btn-sm" onclick="createOrder()">建立訂單</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white">
        訂單列表
      </div>
      <div class="card-body">
        <div class="mb-3">
          <button class="btn btn-success" onclick="exportExcel()">匯出 Excel</button>
          <button class="btn btn-secondary" onclick="exportPDF()">匯出 PDF</button>
          <button class="btn btn-danger" onclick="clearOrders()">🗑 清空所有訂單</button>
          <span class="ms-3 fw-bold">總金額：$<span id="totalAmount">0</span></span>
        </div>

        <ul id="orderList" class="list-group"></ul>
      </div>
    </div>
  </div>

  <datalist id="productListData"></datalist>

  <script>
    const user = localStorage.getItem("user");

    if (!user) {
      alert("請先登入");
      window.location.href = "../login.html";
    }

    function logout() {
      localStorage.removeItem("user");
      window.location.href = "../login.html";
    }

    let productMap = {};

    function addItem() {
      const div = document.createElement("div");
      div.className = "row g-2 mb-2";

      div.innerHTML = `
        <div class="col-md-6">
          <input list="productListData" class="form-control product" placeholder="搜尋商品名稱" />
        </div>
        <div class="col-md-4">
          <input type="number" class="form-control qty" placeholder="數量" />
        </div>
        <div class="col-md-2">
          <button class="btn btn-danger w-100" onclick="this.closest('.row').remove()">❌</button>
        </div>
      `;

      document.getElementById("items").appendChild(div);
    }

    async function loadProductsToDatalist() {
      const res = await fetch("/api/products");
      const products = await res.json();

      const dataList = document.getElementById("productListData");
      dataList.innerHTML = "";
      productMap = {};

      products.forEach(p => {
        const option = document.createElement("option");
        option.value = p.name;
        option.label = `$${p.price}`;
        dataList.appendChild(option);

        productMap[p.name] = p.id;
      });
    }

    async function createOrder() {
      const items = [];

      document.querySelectorAll("#items > div").forEach(div => {
        const productName = div.querySelector(".product").value;
        const product_id = productMap[productName];
        const quantity = Number(div.querySelector(".qty").value);

        if (product_id && quantity) {
          items.push({ product_id, quantity });
        }
      });

      if (items.length === 0) {
        alert("請至少新增一個商品");
        return;
      }

      const customer_name = document.getElementById("customerName").value;

      await fetch("/api/orders", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ items, customer_name })
      });

      document.getElementById("customerName").value = "";
      document.getElementById("items").innerHTML = "";
      addItem();
      loadOrders();
    }

    async function loadOrders() {
      const res = await fetch("/api/orders");
      const orders = await res.json();

      const list = document.getElementById("orderList");
      list.innerHTML = "";

      let total = 0;

      orders.forEach(o => {
        total += Number(o.total_price);

        const li = document.createElement("li");
        li.className = "list-group-item";

        li.innerHTML = `
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <strong>${o.customer_name || "未填客人"}｜訂單 #${o.id}</strong>｜總價：$${o.total_price}
            </div>
            <div>
              <button class="btn btn-info btn-sm" onclick="toggleDetail(${o.id})">查看明細</button>
              <button class="btn btn-danger btn-sm" onclick="deleteOrder(${o.id})">刪除</button>
            </div>
          </div>
          <ul id="detail-${o.id}" class="mt-2" style="display:none;"></ul>
        `;

        list.appendChild(li);
      });

      document.getElementById("totalAmount").innerText = total;
    }

    async function toggleDetail(orderId) {
      const detail = document.getElementById(`detail-${orderId}`);

      if (detail.style.display === "none") {
        const res = await fetch(`/api/orders/${orderId}`);
        const items = await res.json();

        detail.innerHTML = "";

        items.forEach(i => {
          const li = document.createElement("li");
          li.textContent = `${i.name} x${i.quantity} = $${i.subtotal}`;
          detail.appendChild(li);
        });

        detail.style.display = "block";
      } else {
        detail.style.display = "none";
      }
    }

    async function deleteOrder(id) {
      if (!confirm("確定要刪除這筆訂單嗎？庫存會加回。")) return;

      await fetch(`/api/orders/${id}`, {
        method: "DELETE"
      });

      loadOrders();
    }

    async function clearOrders() {
      if (!confirm("確定要清空所有訂單嗎？庫存不會回加。")) return;

      const res = await fetch("/api/orders/clear", {
        method: "DELETE"
      });

      const data = await res.json();

      if (data.success) {
        alert("已全部清空，庫存未回加");
        document.getElementById("orderList").innerHTML = "";
        document.getElementById("totalAmount").innerText = "0";
        loadOrders();
      } else {
        alert("清空失敗，請檢查後端 /api/orders/clear");
        console.log(data);
      }
    }

    loadProductsToDatalist();
    addItem();
    loadOrders();
function exportExcel() {
  window.location.href = "/api/orders/export/excel";
}

function exportPDF() {
  window.location.href = "/api/orders/export/pdf";
}
  </script>
</body>
</html>
