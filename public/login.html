<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>登入｜月暈 ERP</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="height:100vh;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">

        <div class="card shadow">
          <div class="card-header text-center bg-dark text-white">
            ERP 登入
          </div>

          <div class="card-body">
            <input id="username" class="form-control mb-3" placeholder="帳號" />
            <input id="password" type="password" class="form-control mb-3" placeholder="密碼" />

            <button class="btn btn-primary w-100" onclick="login()">登入</button>

            <div id="msg" class="text-danger mt-3 text-center"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (data.success) {
        localStorage.setItem("user", JSON.stringify(data.user));

        // 🔥 登入成功跳轉
        window.location.href = "/products/index.html";
      } else {
        document.getElementById("msg").innerText = data.message;
      }
    }
  </script>

</body>
</html>
