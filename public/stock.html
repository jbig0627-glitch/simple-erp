<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>月暈 ERP｜庫存清點</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">月暈 ERP</span>
    <div>
      <a class="btn btn-outline-light btn-sm" href="/products/index.html">商品管理</a>
      <a class="btn btn-outline-light btn-sm" href="/orders/index.html">訂單管理</a>
      <a class="btn btn-outline-warning btn-sm" href="/stock.html">庫存清點</a>
      <button class="btn btn-danger btn-sm" onclick="logout()">登出</button>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="card shadow-sm">
      <div class="card-header bg-warning fw-bold">
        📦 庫存清點表
      </div>

      <div class="card-body">
        <input id="search" class="form-control mb-3" placeholder="搜尋商品名稱" oninput="loadStock()" />

        <table class="table table-bordered table-hover text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>商品名稱</th>
              <th>價格</th>
              <th>目前庫存</th>
              <th>清點後庫存</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="stockList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const user = localStorage.getItem("user");

    if (!user) {
      alert("請先登入");
      window.location.href = "/login.html";
    }

    function logout() {
      localStorage.removeItem("user");
      window.location.href = "/login.html";
    }

    async function loadStock() {
      const res = await fetch("/api/products");
      let products = await res.json();

      const keyword = document.getElementById("search").value;

      if (keyword) {
        products = products.filter(p => p.name.includes(keyword));
      }

      const list = document.getElementById("stockList");
      list.innerHTML = "";

      products.forEach(p => {
        const stock = Number(p.stock || 0);

        let stockClass = "";
        if (stock < 0) {
          stockClass = "text-danger fw-bold";
        } else if (stock <= 5) {
          stockClass = "text-warning fw-bold";
        }

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${p.id}</td>
          <td>${p.name}</td>
          <td>$${p.price}</td>
          <td class="${stockClass}">${stock}</td>
          <td>
            <input id="stock-${p.id}" type="number" class="form-control text-center" value="${stock}" />
          </td>
          <td>
            <button class="btn btn-success btn-sm" onclick="updateStock(${p.id})">更新庫存</button>
          </td>
        `;

        list.appendChild(tr);
      });
    }

    async function updateStock(id) {
      const stock = Number(document.getElementById("stock-" + id).value);

      await fetch("/api/products/stock/" + id, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ stock })
      });

      alert("庫存更新成功");
      loadStock();
    }

    loadStock();
  </script>
</body>
</html>
